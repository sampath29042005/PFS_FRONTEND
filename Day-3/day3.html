<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <!-- 
    tables
    semantics
    block span
    internal routing
    deploy
     -->
    <nav>
        <a href="#table">table</a>
        <a href="#divspan">div and span</a>
        <a href="#iframe">iframe</a>
    </nav>
    <table id="table" border="1" cellpadding="10" cellspacing="0">
        <tr>
            <td rowspan="1"> 1</td>
            <td rowspan="1">2</td>
            <td rowspan="1">3</td>
        </tr>
        <tr>
            <td rowspan="2">4</td>
            <td rowspan="2" >5</td>
            <td rowspan="2" >6</td>
        </tr>
        <tr>
            <td colspan="1">7</td>
            <td colspan="2">8</td>
            <td colspan="3">9</td>
        </tr>
    </table>
    <!-- 
        tags are divided based on the behavior
        1) block level elements - block level elements which occpies total space and always starts from new line
        ex: div, headings, p, table,

        2) inline level elements - inline level elements which occupies necessary space and it does not starts from new line
        ex: span, a, img, input, label

        div container - it is used to group the elements and it is used to apply styles
        span container - it is used to group the elements and it is used to apply styles
         
        sematics tags 
        they are the tags which convey the meaning of the content to the browser and developers  
        it is used to improve the accessibility
        ex: header, footer, main, article, section, nav, aside

        iframe - 
        it is used to embed another webpage into the current webpage
        it is used to embed videos, maps, forms, etc
        -->
        <div id="divspan" style="background-color: lightgray; ">
            <h1>section<span style="color: blue; font-size:3rem;">1</span></h1>
            <p>This is a simple div container.</p>
        </div>
        <div  style="background-color: lightblue; ">
            <h1>section<span style="color: red; font-size:3rem;">2</span></h1>
            <p>This is a simple div container.</p>
        </div>
        <div  style="background-color: lightgreen; ">
            <h1>section<span style="color: orange; font-size:3rem;">3</span></h1>
            <p>This is a simple div container.</p>
        </div>
        <iframe id="iframe" width="560" height="315" src="https://www.youtube.com/embed/qz0aGYrrlhU?si=8KqYZcXl0N3hRcQ3" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <br>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d26624.67833197417!2d83.2918634293567!3d17.715595227595916!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a39436f113dca6d%3A0xd76a1de2271dff26!2sRamakrishna%20Beach!5e0!3m2!1sen!2sin!4v1795240978276!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

</body>
</html>
